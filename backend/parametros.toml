# Parámetros del prototipo (Entrega 3).
#
# Reúne en un solo archivo los valores de cada etapa del procesamiento, las reglas de diseño y la
# versión de los modelos utilizados, para que las pruebas puedan reproducirse con los mismos
# parámetros (Estructura de Datos). Los marcados como "valor inicial" se calibran en las pruebas
# de cada incremento (Herramientas Metodológicas).

[objetivo]                           # HU-002
dias_min = 1
dias_max = 14
nota_min = 6
nota_max = 10
lenguajes = ["java", "python"]       # Alcances: solo Java y Python en la demostración
# Dominio requerido según la nota objetivo (CA2) y días mínimos que necesita cada nota (CA6).
dominio_requerido = { 6 = 60, 7 = 60, 8 = 80, 9 = 80, 10 = 90 }
dias_minimos = { 6 = 3, 7 = 3, 8 = 4, 9 = 4, 10 = 5 }

[material]                           # HU-003 y Seguridad (medidas complementarias)
formatos = ["pdf", "docx", "pptx"]
max_mb_por_archivo = 25
max_archivos_por_tema = 20
cuota_mb_por_estudiante = 200

[rag]                                # Estructura de Datos: las cinco etapas del procesamiento
tam_fragmento = 400                  # caracteres
solapamiento = 60
max_tokens = 128                     # límite del modelo de embeddings, con los tokens especiales: el fragmento que se pasa se subdivide
max_ilegible = 0.5                   # si la mitad o más de una línea son glifos ilegibles del PDF (U+FFFF), se descarta la línea
fragmento_minimo = 30               # más corto que esto (un título suelto) no se indexa si el archivo tiene más texto
candidatos = 20                      # se piden más fragmentos a ChromaDB: el re-ranking los reordena y la diversidad elige 6
reranking = true                     # reordenar los candidatos con el cross-encoder (con 40 candidatos: el doble de tiempo, igual acierto@1)
max_por_origen = 3                   # fuentes académicas: como mucho 3 de los 6 de un mismo libro (con 2 se pierden respuestas: ver informe)
max_por_origen_propio = 0            # material propio: sin máximo (0); los apuntes del estudiante suelen ser pocos
k_por_fuente = 6                    # fragmentos más similares de cada fuente (propia y académica)
similitud_minima = 0.45              # similitud coseno = 1 − distancia que devuelve ChromaDB; calibrado con evaluacion/consultas.json (valor inicial de la E3: 0,35; ver informe.md)
vecinos = 1                          # al recuperar, se agregan los fragmentos anterior y siguiente como contexto
fragmentos_minimos = 2              # HU-003 CA5: con menos, el material es insuficiente
modelo_embeddings = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
modelo_reranking = "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"   # cross-encoder multilingüe, Apache 2.0, ~470 MB (ONNX)

[llm]                                # Herramientas de Desarrollo: criterio de asignación de modelos
modelo_contenido = "claude-sonnet-5-5"   # contenido, contraste de fuentes y evaluación de explicaciones
modelo_pistas = "claude-haiku-5-5"       # pistas mínimas
espera_maxima_segundos = 20           # si no responde a tiempo se usa el texto de respaldo
reintentos = 1
max_tokens_pista = 300                # pista mínima: una oración, dos como máximo
max_tokens_explicacion = 600          # explicación elaborada: tres oraciones como máximo
largo_maximo_pista = 400              # caracteres: una respuesta más larga no es una pista mínima y se descarta
largo_maximo_explicacion = 900       # carga cognitiva (Shute, 2008): una explicación más larga se descarta
fragmentos_explicacion = 3            # fragmentos del material que acompañan el pedido de la explicación elaborada

[judge0]                             # Diagrama de Arquitectura
cpu_segundos = 5
memoria_mb = 128
espera_maxima_segundos = 30
consulta_cada_segundos = 1
reintentos = 1
# Identificadores de lenguaje de Judge0 CE (GET /languages): Python 3.8.1 y Java (OpenJDK 13.0.1).
lenguajes = { python = 71, java = 62 }

[detector]                           # HU-006; valores iniciales sujetos a calibración
intentos_iguales = 3
lineas_cambio_minimo = 2
factor_tiempo = 2.5
inactividad_segundos = 300           # el tiempo activo se detiene tras 5 minutos sin editar
aviso_tiempo_segundos = 30

[aprender]                           # HU-004
preguntas = 5
aprobacion = 0.6
# Composición de la evaluación según el nivel inicial (CA6): básicas, intermedias y avanzadas.
mezcla = { principiante = [3, 2, 0], intermedio = [1, 3, 1], avanzado = [0, 2, 3] }
items_por_concepto = 4                # tarjetas o preguntas al practicar un solo concepto
fragmentos_por_concepto = 3          # fragmentos del RAG que acompañan cada concepto en tarjetas, cuestionario y evaluación
largo_maximo_explicacion = 12000     # caracteres de la explicación de un concepto en la lección guiada (clase ordenada por secciones)
max_tokens_explicacion = 6000         # con margen: si igual se corta, los datos ya llegaron (van primero) y se recorta el final
espera_maxima_segundos = 150          # el contenido de Aprender es más largo que una pista: se le da más tiempo
max_tokens_consulta = 1500                # si igual se corta, se conserva hasta el último párrafo completo
max_tokens_reformulacion = 200        # reescritura de una consulta breve antes de buscar de nuevo (modelo de pistas)
largo_maximo_reformulacion = 300
largo_texto_cita = 1600              # caracteres del fragmento (con sus vecinos) que se envían para mostrar en cada cita
max_tokens_practica = 3000
max_tokens_resumen = 1500               # resumen breve del tema al terminar de recorrer los conceptos
max_tokens_evaluacion = 5000

[practicar]                          # Alcances y HU-011
ejercicios_para_aprobar = 5
mezcla = { principiante = [2, 2, 1], intermedio = [1, 2, 2], avanzado = [0, 2, 3] }
puntos = { sin_ayuda = 10, pista_minima = 7, explicacion_elaborada = 4 }

[consolidar]                         # HU-008
conceptos_min = 3
conceptos_max = 5
largo_minimo = 120                   # caracteres de la explicación: menos no alcanza para explicar un tema
largo_maximo = 4000
largo_minimo_respuesta = 2           # respuesta en la charla («no sé» también vale) o a una pregunta de seguimiento
largo_maximo_respuesta = 1500
seguimientos_por_concepto = 3        # preguntas de seguimiento por concepto en la charla antes de pasar al siguiente
max_tokens_disparadores = 2000       # una pregunta disparadora por concepto, en un solo pedido
max_tokens_charla = 1500             # evaluación de una respuesta de la charla y devolución de Brity
max_tokens_evaluacion = 3000         # cada una de las dos evaluaciones independientes (CA5)
max_tokens_seguimiento = 500
largo_maximo_seguimiento = 300       # caracteres: una pregunta, no una explicación
espera_maxima_segundos = 120

[dominio]                            # HU-010: 0,3 × A + 0,4 × P + 0,3 × C
peso_aprender = 0.3
peso_practicar = 0.4
peso_consolidar = 0.3
consolidar = { correcta = 100, incompleta = 50, incorrecta = 0 }

[sesion]                             # Seguridad: acceso a la aplicación
jwt_horas = 8
